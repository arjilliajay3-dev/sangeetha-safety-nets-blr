<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8A2F4D" />
      <stop offset="50%" stopColor="#6D1A36" />
      <stop offset="100%" stopColor="#420D20" />
    </linearGradient>
    <linearGradient id="sSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E5E7EB" />
      <stop offset="100%" stopColor="#B9BEC7" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Burgundy Shield -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#sBurgundy)" stroke="url(#sSilver)" stroke-width="3.5" />

  <!-- Elegant 'S' Monogram for Sangeetha Safety Nets -->
  <path
    d="M 68 28
       C 64 24, 52 23, 42 25
       C 32 27, 28 35, 29 42
       C 30 50, 40 52, 54 55
       C 68 58, 73 63, 71 71
       C 69 79, 58 81, 46 80
       C 36 79, 30 74, 27 69"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Silver Precision Anchor Accent Points -->
  <circle cx="68" cy="28" r="4.5" fill="url(#sSilver)" />
  <circle cx="27" cy="69" r="4.5" fill="url(#sSilver)" />
</svg>
