<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100" fill="none">
  <defs>
    <linearGradient id="sLogoBurgundyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8A2F4D" />
      <stop offset="50%" stopColor="#6D1A36" />
      <stop offset="100%" stopColor="#420D20" />
    </linearGradient>
    <linearGradient id="sLogoSilverLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E5E7EB" />
      <stop offset="100%" stopColor="#B9BEC7" />
    </linearGradient>
  </defs>

  <!-- Monogram Shield 'S' Badge -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="22" fill="url(#sLogoBurgundyLight)" />
    <!-- Outer Shield Border Accent -->
    <rect x="3" y="3" width="74" height="74" rx="19" stroke="url(#sLogoSilverLight)" stroke-width="2.5" fill="none" opacity="0.9" />
    <!-- Stylized 'S' Monogram -->
    <path
      d="M 54 22
         C 50 18, 40 17, 33 19
         C 25 21, 22 28, 23 34
         C 24 40, 32 42, 43 45
         C 54 48, 58 52, 56 59
         C 54 65, 45 67, 36 66
         C 28 65, 23 61, 20 57"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
    />
    <circle cx="54" cy="22" r="3.5" fill="url(#sLogoSilverLight)" />
    <circle cx="20" cy="57" r="3.5" fill="url(#sLogoSilverLight)" />
  </g>

  <!-- Typography: Sangeetha Safety Nets (Light) -->
  <text x="106" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    SANGEETHA
  </text>
  <text x="290" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#B9BEC7" letter-spacing="-0.5">
    SAFETY
  </text>
  <text x="108" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E5E7EB" letter-spacing="3.5">
    NETS &amp; INVISIBLE GRILLS
  </text>
</svg>
